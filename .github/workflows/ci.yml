name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python（lint + 测试 + 安全守卫） ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装服务核心依赖
        run: pip install -e "server[dev]"
      # 根 tests 的依赖面：TUI 单测要 Textual（连带 rich，star_console 富文本态也靠它），
      # wpd 提取要 cv2/numpy（CI 用 headless 版，无 GUI 依赖）；spider 模块纯标准库。
      - name: 安装根 tests 依赖
        run: pip install -e "tui" opencv-python-headless
      - name: Ruff lint
        run: ruff check server scripts
      - name: 服务核心单元测试
        run: pytest server/tests -q
      - name: 根目录功能测试（模块契约/TUI/star_console/ui_doctor/设计契约等全量）
        run: pytest tests -q
      - name: star_console 双态输出快照比对（非 TTY 管道 vs FORCE_COLOR 强制着色）
        run: pytest tests/test_star_console_dual_state.py -q
      - name: SQL 参数绑定守卫（全仓扫描）
        run: python tests/test_sql_injection_guard.py
      - name: 导出 OpenAPI 契约
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/export_openapi.py --output docs/openapi.json
      - name: OpenAPI 契约 diff=0 门禁（提交版必须与导出逐字节一致）
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code docs/openapi.json
      - name: 上传契约产物
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  design:
    name: 设计契约（gen 幂等 + ui_doctor）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装服务核心依赖
        run: pip install -e "server[dev]"
      - name: 生成三端设计产物
        run: python scripts/gen_design.py
      - name: 设计契约门禁（tokens 变更必须随附再生成，diff=0）
        run: |
          status="$(git status --porcelain -- tui app modules config/design)"
          if [ -n "$status" ]; then
            echo "设计产物与提交不同步（改 tokens.yaml 后必须重跑 scripts/gen_design.py）："
            echo "$status"
            exit 1
          fi
      - name: 设计契约单测（点分键覆盖合并 + 生成物一致性）
        run: python -m pytest tests/test_gen_design.py -q
      # MF1 清账项（placeholder 占位页 / bare-color 裸色）已归零，自此全量门禁，不再 skip。
      - name: ui_doctor 聚合验收（全量门禁）
        run: python scripts/ui_doctor.py

  flutter:
    name: Flutter（analyze + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      # 金测的字体面已由 Flutter 组解耦（不依赖 CI 机器字体），跨平台是否真绿由汇合门禁统一证明。
      - name: Test
        working-directory: app
        run: flutter test
