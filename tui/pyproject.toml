[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroforge-tui"
version = "0.1.0"
description = "AstroForge TUI 工作台（Textual 客户端，对接 Sidereal Core）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "textual>=0.70",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.scripts]
astroforge-tui = "tui.app:main"

[tool.setuptools.packages.find]
include = ["tui*"]
