# ============================================================
# AstroForge 星符表（icons.yaml）——语义名唯一映射，禁散落硬编码字符
# 消费：TUI（直接字形）· Flutter（lucide_icons 映射，线性 20dp stroke1.8）
# 纪律：代码中一律引用语义名（icons.nav.home），grep 验收零裸星符
# ============================================================
version: 1

nav:
  home: "✦"        # lucide: home
  spider: "☄"      # lucide: globe
  parser: "◈"      # lucide: file-search
  converter: "❖"   # lucide: file-symlink
  pipeline: "✺"    # lucide: workflow
  monitor: "◉"     # lucide: activity
  history: "☾"     # lucide: history
  settings: "✜"    # lucide: settings
  task: "✧"        # lucide: layout-list（IA 5 页制的「任务」页）

ai:
  idle: "✵"        # lucide: sparkles
  thinking: "✶"    # 帧动画 ✶→✷→✸（1.2s 循环）
  thinking_f2: "✷"
  thinking_f3: "✸"
  done: "☄"
  send: "✵"
  fallback: "✧"

status:
  ok: "●"
  idle: "◌"
  error: "✕"
  warn: "▲"
  hint: "✧"

task:
  running: "◈"     # 帧动画 ◈→◉
  running_f2: "◉"
  pending: "○"
  success: "✓"
  failed: "✕"
  canceled: "⊘"
  pdf: "⬇"          # 采集中心·PDF 批量（§3.3 四类任务星符）
  table: "▦"        # 采集中心·表格抓取（§3.3 四类任务星符）
  step_cursor: "▶"  # 流水线时间线当前步骤游标（§3.4 `◈─▶ 转换 DOCX`）

misc:
  meteor: "☄"
  star_rank_1: "✦"
  star_rank_2: "✦✦"
  star_rank_3: "✧"
  binary_star: "✦✧"
  caret_down: "▾"    # 模型胶囊/折叠区下拉指示（§3.6 模型胶囊 `qwen2b ▾`）
  caret_right: "▸"   # 折叠区收起态指示（§3.3 「✧ 高级」）
  spinner_f1: "◐"   # 探活/加载跑圈帧（#17，1.2s 循环：◐◓◑◒）
  spinner_f2: "◓"
  spinner_f3: "◑"
  spinner_f4: "◒"
  star_dim: "·"      # 星野暗星（seed.json tier0）
  star_mid: "•"      # 星野中亮星（tier1；tier2 复用 star_rank_1 ✦）
