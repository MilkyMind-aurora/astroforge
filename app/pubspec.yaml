name: astroforge
description: "AstroForge（衍星台）Flutter 桌面客户端 —— 本地文档智能处理工作台（TUI 之外的图形端，对接 Sidereal Core 服务核心）。"
publish_to: 'none'

# 版本号与服务核心（pyproject.toml）同源发布，同一 tag。
version: 0.1.0+1

environment:
  # 对齐方案 3.10：Dart 3.8+ 基线（当前 stable 为 3.13.x，向下兼容到 3.8）
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理 / 路由
  flutter_riverpod: 2.6.1
  go_router: ^18.0.0

  # 网络层：REST + WebSocket 三通道（monitor / logs / ai）
  dio: ^5.11.0
  web_socket_channel: ^3.0.3

  # 监控实时曲线
  fl_chart: ^1.2.0

  # 桌面集成：窗口尺寸记忆 / 最小尺寸 / 标题
  window_manager: ^0.5.2

  # 后续 Phase 使用：文件选择（解析/转换中心）、客户端自身偏好存储（仅主题/窗口/服务端口，不存业务数据）
  file_picker: ^12.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
